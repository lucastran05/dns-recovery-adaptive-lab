- name: Install dnsmasq binary without default daemon
  ansible.builtin.apt:
    name: dnsmasq-base
    state: present
- name: Configure isolated client cache
  ansible.builtin.copy:
    dest: /etc/dns-lab/cache.conf
    content: 'port=5353

      listen-address=127.0.0.1

      bind-interfaces

      no-resolv

      no-hosts

      server=/{{ zone | regex_replace("\.$", "") }}/{{ dns_ip }}

      cache-size=100

      neg-ttl=30

      user=nobody

      '
    mode: '0644'
- name: Install cache service
  ansible.builtin.copy:
    dest: /etc/systemd/system/dns-lab-cache.service
    content: '[Unit]

      Description=Isolated DNS lab client cache

      After=network-online.target

      [Service]

      Type=simple

      ExecStart=/usr/sbin/dnsmasq --keep-in-foreground --conf-file=/etc/dns-lab/cache.conf
      --pid-file=/run/dns-lab-cache.pid

      ExecReload=/bin/kill -HUP $MAINPID

      Restart=on-failure

      [Install]

      WantedBy=multi-user.target

      '
    mode: '0644'
- name: Start client cache
  ansible.builtin.systemd:
    name: dns-lab-cache
    enabled: true
    state: restarted
    daemon_reload: true
- name: Install agent unit
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/agent.service.j2'
    dest: /etc/systemd/system/dns-lab-agent.service
    mode: '0644'
- name: Start agent
  ansible.builtin.systemd:
    name: dns-lab-agent
    state: started
    enabled: true
    daemon_reload: true
