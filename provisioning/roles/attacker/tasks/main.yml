- name: Install deliberately exposed legacy lab key
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/legacy.key.j2'
    dest: /etc/dns-lab/legacy.key
    mode: '0600'
  no_log: true
- name: Install agent unit
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/agent.service.j2'
    dest: /etc/systemd/system/dns-lab-agent.service
    mode: '0644'
- name: Start agent
  ansible.builtin.systemd:
    name: dns-lab-agent
    state: started
    enabled: true
    daemon_reload: true
