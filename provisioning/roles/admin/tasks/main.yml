- name: Install agent unit
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/agent.service.j2'
    dest: /etc/systemd/system/dns-lab-agent.service
    mode: '0644'
- name: Start agent
  ansible.builtin.systemd:
    name: dns-lab-agent
    state: started
    enabled: true
    daemon_reload: true
- name: Create student account
  ansible.builtin.user:
    name: '{{ student_user }}'
    password: '{{ student_password_hash }}'
    create_home: true
    shell: /bin/bash
- name: Install student CLI
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/files/dns-lab.py'
    dest: /usr/local/bin/dns-lab
    owner: root
    mode: '0755'
- name: Configure student CLI
  ansible.builtin.copy:
    dest: /home/{{ student_user }}/.dns-lab.json
    content: '{{ {"url": admin_api, "username": student_user, "password": student_password}
      | to_nice_json }}'
    owner: '{{ student_user }}'
    mode: '0600'
  no_log: true
- name: Provide student guide
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../docs/STUDENT_GUIDE.md'
    dest: /home/{{ student_user }}/STUDENT_GUIDE.md
    owner: '{{ student_user }}'
    mode: '0644'
